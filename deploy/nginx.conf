# ===========================================================================
# WIDDX Nexus — Nginx Reverse Proxy Configuration
# ===========================================================================
# يوضع في /etc/nginx/sites-available/widdx
# ثم: sudo ln -s /etc/nginx/sites-available/widdx /etc/nginx/sites-enabled/
#      sudo certbot --nginx -d widdx.yourdomain.com
#      sudo systemctl reload nginx
# ===========================================================================

limit_req_zone $binary_remote_addr zone=widdx_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=widdx_web:10m rate=30r/m;

upstream widdx_web {
    server 127.0.0.1:8000;
    keepalive 64;
}

upstream widdx_api {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 80;
    server_name widdx.yourdomain.com;
    
    # ── Redirect HTTP → HTTPS ───────────────────────────
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name widdx.yourdomain.com;

    # ── SSL (Let's Encrypt via Certbot) ─────────────────
    ssl_certificate     /etc/letsencrypt/live/widdx.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/widdx.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Security Headers ────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Max Body Size ───────────────────────────────────
    client_max_body_size 10M;

    # ── Web UI ───────────────────────────────────────────
    location / {
        limit_req zone=widdx_web burst=10 nodelay;
        proxy_pass http://widdx_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── WebSocket (Chat) ────────────────────────────────
    location /ws/ {
        limit_req zone=widdx_web burst=5 nodelay;
        proxy_pass http://widdx_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;  # WebSocket sessions can be long
        proxy_send_timeout 3600s;
    }

    # ── REST API ─────────────────────────────────────────
    location /api/ {
        limit_req zone=widdx_api burst=20 nodelay;
        proxy_pass http://widdx_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /standalone-api/ {
        limit_req zone=widdx_api burst=20 nodelay;
        proxy_pass http://widdx_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Static Files (cached) ───────────────────────────
    location /static/ {
        proxy_pass http://widdx_web;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Logs ─────────────────────────────────────────────
    access_log /var/log/nginx/widdx_access.log;
    error_log  /var/log/nginx/widdx_error.log warn;
}
