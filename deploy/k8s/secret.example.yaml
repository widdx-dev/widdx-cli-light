# ═══════════════════════════════════════════════════════════════════
# WIDDX Nexus — Secrets TEMPLATE (copy to secret.yaml, fill, apply)
# ═══════════════════════════════════════════════════════════════════
#   cp secret.example.yaml secret.yaml
#   # edit secret.yaml with real values, then:
#   kubectl apply -f secret.yaml
#
# ⚠ NEVER commit the filled secret.yaml — it is git-ignored.
# For real clusters prefer ExternalSecrets / SealedSecrets / Vault.
# ═══════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: widdx-nexus-secrets
  namespace: widdx
  labels:
    app.kubernetes.io/name: widdx-nexus
    app.kubernetes.io/part-of: widdx
type: Opaque
stringData:
  # API bearer key (required by the REST API)
  WIDDX_API_KEY: "CHANGE-ME-api-key"
  # Admin dashboard key (enables /admin when set)
  WIDDX_ADMIN_KEY: "CHANGE-ME-admin-key"
  # Optional tenant→key map, e.g. "acme:key-1,globex:key-2"
  WIDDX_TENANT_KEYS: ""
