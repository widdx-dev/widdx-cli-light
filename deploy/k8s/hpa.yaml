# ═══════════════════════════════════════════════════════════════════
# WIDDX Nexus — HorizontalPodAutoscaler (Task 4.4)
# ═══════════════════════════════════════════════════════════════════
# Scales 2 → 10 replicas on CPU (70%) and memory (80%).
# Requires the metrics-server add-on in the cluster.
#
# NOTE on storage: the default PVC is ReadWriteOnce, so autoscaled
# pods can only co-schedule on the node owning the volume unless you
# use a ReadWriteMany storage class. See README.md.
# ═══════════════════════════════════════════════════════════════════
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: widdx-nexus
  namespace: widdx
  labels:
    app.kubernetes.io/name: widdx-nexus
    app.kubernetes.io/part-of: widdx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: widdx-nexus
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # avoid flapping on traffic dips
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
