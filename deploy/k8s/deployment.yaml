# ═══════════════════════════════════════════════════════════════════
# WIDDX Nexus — Kubernetes Deployment (Task 4.4)
# ═══════════════════════════════════════════════════════════════════
# Serves the web UI + REST API (entrypoint: widdx-web, port 8000).
#
# Build the image first:
#   docker build -t widdx/nexus:3.3.0 .
#
# Storage notes:
#   The default PersistentVolumeClaim uses ReadWriteOnce, so with
#   replicas > 1 pods must be scheduled on the same node OR you must
#   use a ReadWriteMany storage class (NFS, CephFS, EFS…). See README.
# ═══════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: widdx-nexus
  namespace: widdx
  labels:
    app.kubernetes.io/name: widdx-nexus
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: widdx
    app.kubernetes.io/version: "3.3.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: widdx-nexus
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: widdx-nexus
        app.kubernetes.io/component: web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # The image defines a non-root `widdx` user — never run as root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30   # matches graceful-shutdown timeout
      containers:
        - name: widdx-nexus
          image: widdx/nexus:3.3.0
          imagePullPolicy: IfNotPresent
          args: ["--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: WIDDX_HOME
              value: /workspace
            - name: PYTHONUNBUFFERED
              value: "1"
          envFrom:
            - configMapRef:
                name: widdx-nexus-config
            - secretRef:
                name: widdx-nexus-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # ── Probes (added to the web server for K8s — no auth) ──
          startupProbe:
            httpGet:
              path: /api/livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12          # up to ~60s of cold start
          livenessProbe:
            httpGet:
              path: /api/livez
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # see README for hardening notes
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: widdx-data
              mountPath: /workspace/.widdx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: widdx-data
          persistentVolumeClaim:
            claimName: widdx-nexus-data
        - name: tmp
          emptyDir: {}
